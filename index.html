        /* =====================================================================
           1. RESET & DESIGN TOKENS (MONOCHROME LIGHT SHELL + VIBRANT DATA)
           ===================================================================== */
        .everest-root {
            --bg-alabaster: #edf0f5;
            --bg-stage-top: rgba(255, 255, 255, 0.88);
            --bg-stage-bottom: rgba(244, 246, 250, 0.96);
            --border-specular: rgba(15, 23, 42, 0.11);
            --border-silver: rgba(15, 23, 42, 0.28);
            --border-steel: rgba(15, 23, 42, 0.18);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            /* Vibrant Data-Only Accents (High-Contrast on Light Frosted Glass) */
            --data-cyan: #0284c7;
            --data-violet: #7c3aed;
            --data-emerald: #059669;
            --data-amber: #d97706;
            --data-rose: #e11d48;
            --tilt-x: 58deg;
            --tilt-z: 0deg;
            --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            /* ===== ELEVATE HEIGHTS (adjust these values to raise/lower) ===== */
            --lift-kpi: 130px;          /* KPI card when clicked */
            --lift-data: 100px;         /* Telemetry data when clicked */
            --lift-node: 110px;         /* Node Status rows (first row is highest) */
            --lift-node-step: 8px;      /* height difference between rows */
            /* ===== MOTION TOKENS (data entrance animations) ===== */
            --motion-duration-bar: 900ms;    /* bars growing */
            --motion-duration-draw: 1400ms;  /* telemetry curve rising */
            --motion-duration-count: 1200ms; /* counters (mirrored by MOTION.countMs in TSX) */
            --motion-stagger: 70ms;          /* delay between sibling bars / rows */
            --motion-ease-grow: cubic-bezier(0.33, 1, 0.68, 1); /* ease-out cubic */
        }
        .everest-root *, .everest-root *::before, .everest-root *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        .everest-root {
            width: 100%;
            height: 100vh;
            font-family: var(--font-sans);
            background-color: var(--bg-alabaster);
            background-image:
                radial-gradient(circle at 16% 18%, rgba(255, 255, 255, 0.95), transparent 46%),
                radial-gradient(circle at 84% 16%, rgba(203, 213, 225, 0.48), transparent 44%),
                radial-gradient(circle at 52% 88%, rgba(148, 163, 184, 0.28), transparent 50%);
            color: var(--text-primary);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        /* =====================================================================
           2. OUTER VIEWPORT & STRICT PRESERVE-3D HIERARCHY
           ===================================================================== */
        .scene-viewport {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            perspective: 1650px;
            perspective-origin: 50% 42%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .dashboard-stage {
            width: 100%;
            height: 100%;
            display: flex;
            position: relative;
            transform-style: preserve-3d;
            overflow: visible;
            background: linear-gradient(155deg, var(--bg-stage-top), var(--bg-stage-bottom));
            transition: transform 0.85s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.8s ease, border-radius 0.8s ease;
            will-change: transform;
        }
        .everest-root.is-3d .dashboard-stage {
            border-radius: 28px;
            border: 1.5px solid rgba(15, 23, 42, 0.22);
            box-shadow:
                0 65px 130px -20px rgba(15, 23, 42, 0.28),
                0 20px 55px -10px rgba(15, 23, 42, 0.14),
                inset 0 0 60px rgba(255, 255, 255, 0.85);
        }
        /* Monochrome Light Holographic Command Floor Grid */
        .floor-grid-overlay {
            position: absolute;
            inset: 0;
            border-radius: 28px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.65s ease;
            background-image:
                linear-gradient(to right, rgba(15, 23, 42, 0.08) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(15, 23, 42, 0.08) 1px, transparent 1px);
            background-size: 48px 48px;
            transform: translateZ(1px);
        }
        .everest-root.is-3d .floor-grid-overlay {
            opacity: 1;
        }
        /* =====================================================================
           3. SIDEBAR NAVIGATION (MONOCHROME PORCELAIN FROSTED GLASS)
           ===================================================================== */
        .sidebar {
            width: 244px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-right: 1px solid rgba(15, 23, 42, 0.09);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(241, 245, 249, 0.96));
            transform-style: preserve-3d;
            overflow: visible;
            transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.6s ease, border-color 0.5s ease;
            z-index: 20;
        }
        .everest-root.is-3d .sidebar {
            transform: translateZ(12px);
            border-radius: 26px 0 0 26px;
            border-color: rgba(15, 23, 42, 0.2);
            box-shadow: 16px 24px 44px -12px rgba(15, 23, 42, 0.16), 0 0 24px rgba(255, 255, 255, 0.8);
        }
        .sidebar-header {
            height: 62px;
            padding: 0 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(15, 23, 42, 0.08);
        }
        .brand-wrap {
            display: flex;
            align-items: center;
            gap: 11px;
        }
        .brand-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, #1e293b, #0f172a 60%, #334155);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 14px rgba(15, 23, 42, 0.22);
            border: 1px solid rgba(15, 23, 42, 0.35);
        }
        .brand-title {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #0f172a;
            display: block;
            line-height: 1.1;
        }
        .brand-sub {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.11em;
            text-transform: uppercase;
            color: #475569;
        }
        .sidebar-nav {
            padding: 15px 12px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .nav-section-label {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            padding: 8px 11px 4px;
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9.5px 12px;
            border-radius: 11px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            background: transparent;
            width: 100%;
            text-align: left;
        }
        .nav-item:hover {
            color: #0f172a;
            background: rgba(15, 23, 42, 0.05);
        }
        .nav-item.active {
            color: #ffffff;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-color: #0f172a;
            box-shadow: 0 8px 18px -6px rgba(15, 23, 42, 0.32);
        }
        .nav-badge {
            margin-left: auto;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.16);
            color: #f8fafc;
            border: 1px solid rgba(255, 255, 255, 0.28);
        }
        .sidebar-footer {
            padding: 14px;
            border-top: 1px solid rgba(15, 23, 42, 0.08);
        }
        .sidebar-promo {
            padding: 13px;
            border-radius: 15px;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.96), rgba(241, 245, 249, 0.96));
            border: 1px solid rgba(15, 23, 42, 0.14);
            box-shadow: 0 6px 16px -6px rgba(15, 23, 42, 0.08);
        }
        .promo-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
            font-size: 12px;
            font-weight: 700;
            color: #0f172a;
        }
        .status-pill {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 999px;
            background: #e2e8f0;
            color: #334155;
            border: 1px solid rgba(15, 23, 42, 0.14);
        }
        .status-pill.active-3d {
            background: #0f172a;
            color: #ffffff;
            border-color: #0f172a;
        }
        .promo-desc {
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.42;
            margin-bottom: 10px;
        }
        .kbd-hint {
            display: inline-block;
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 700;
            padding: 1px 5px;
            border-radius: 4px;
            background: #f1f5f9;
            border: 1px solid rgba(15, 23, 42, 0.22);
            color: #0f172a;
        }
        /* =====================================================================
           4. MAIN COLUMN & MONOCHROME LIGHT MACOS HEADER
           ===================================================================== */
        .main-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            transform-style: preserve-3d;
            overflow: visible;
        }
        .top-header {
            height: 62px;
            padding: 0 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(15, 23, 42, 0.09);
            background: linear-gradient(90deg, rgba(255, 255, 255, 0.92), rgba(248, 250, 252, 0.95));
            transform-style: preserve-3d;
            overflow: visible;
            transition: transform 0.75s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.6s ease, border-color 0.5s ease;
            z-index: 25;
            flex-shrink: 0;
        }
        .everest-root.is-3d .top-header {
            transform: translateZ(12px);
            border-radius: 0 26px 0 0;
            border-color: rgba(15, 23, 42, 0.2);
            box-shadow: 0 16px 32px -12px rgba(15, 23, 42, 0.14), 0 0 20px rgba(255, 255, 255, 0.75);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .mac-window-controls {
            display: flex;
            align-items: center;
            gap: 7px;
            padding-right: 10px;
            border-right: 1px solid rgba(15, 23, 42, 0.14);
        }
        .mac-btn {
            width: 11.5px;
            height: 11.5px;
            border-radius: 50%;
            border: 1px solid rgba(15, 23, 42, 0.22);
            display: inline-block;
        }
        .header-title {
            font-size: 15.5px;
            font-weight: 800;
            letter-spacing: -0.015em;
            color: #0f172a;
        }
        .live-status-pill {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 4px 10px;
            border-radius: 999px;
            background: rgba(15, 23, 42, 0.04);
            border: 1px solid rgba(15, 23, 42, 0.12);
            font-size: 11px;
            font-weight: 600;
            color: #334155;
        }
        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--data-emerald);
            box-shadow: 0 0 8px rgba(5, 150, 105, 0.65);
            animation: pulseLive 2s infinite;
        }
        @keyframes pulseLive {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.45; transform: scale(0.85); }
        }
        .mode-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 600;
            background: #f1f5f9;
            color: var(--text-secondary);
            border: 1px solid rgba(15, 23, 42, 0.12);
            transition: all 0.35s ease;
        }
        .mode-indicator.is-3d {
            background: #0f172a;
            color: #ffffff;
            border-color: #0f172a;
            box-shadow: 0 6px 16px -4px rgba(15, 23, 42, 0.28);
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .btn-3d-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 11px;
            border: 1px solid #0f172a;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #ffffff;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 6px 16px -4px rgba(15, 23, 42, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: transform 0.2s ease, box-shadow 0.3s ease, filter 0.2s ease, background 0.3s ease;
        }
        .btn-3d-primary:hover {
            transform: translateY(-1px);
            filter: brightness(1.1);
            box-shadow: 0 10px 22px -6px rgba(15, 23, 42, 0.38);
        }
        .btn-3d-primary:active {
            transform: scale(0.97);
        }
        .everest-root.is-3d .btn-3d-primary {
            background: linear-gradient(135deg, #ffffff, #e2e8f0);
            color: #0f172a;
            border-color: rgba(15, 23, 42, 0.35);
            box-shadow:
                0 8px 20px -4px rgba(15, 23, 42, 0.22),
                inset 0 1px 0 rgba(255, 255, 255, 0.95);
        }
        .btn-full {
            width: 100%;
            justify-content: center;
            padding: 8px 12px;
            font-size: 12px;
        }
        .avatar-badge {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, #cbd5e1, #64748b);
            padding: 1.5px;
        }
        .avatar-inner {
            width: 100%;
            height: 100%;
            border-radius: 8.5px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11.5px;
            font-weight: 800;
            color: #0f172a;
        }
        /* =====================================================================
           5. DASHBOARD WORKSPACE & ERGONOMIC 3D SPACING
           ===================================================================== */
        .dashboard-workspace {
            flex: 1;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            transform-style: preserve-3d;
            overflow-y: auto;
            transition: gap 0.8s cubic-bezier(0.16, 1, 0.3, 1), padding 0.8s ease;
        }
        .everest-root.is-3d .dashboard-workspace {
            overflow: visible;
            padding-top: 26px;
            gap: 56px;
        }
        /* =====================================================================
           6. TOP ROW: 4 MAIN KPI CARDS (UPRIGHT IN 3D MODE)
           ===================================================================== */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 18px;
            transform-style: preserve-3d;
            overflow: visible;
            position: relative;
            z-index: 40;
        }
        .kpi-slot {
            position: relative;
            transform-style: preserve-3d;
            overflow: visible;
            display: flex;
            flex-direction: column;
        }
        /* Monochrome Silver/Charcoal Floor Pedestal */
        .floor-pad {
            position: absolute;
            inset: 6px;
            border-radius: 18px;
            background: radial-gradient(circle at center, rgba(15, 23, 42, 0.1), rgba(148, 163, 184, 0.05) 65%, transparent);
            border: 1px solid rgba(15, 23, 42, 0.22);
            box-shadow: 0 0 24px rgba(15, 23, 42, 0.08);
            opacity: 0;
            pointer-events: none;
            transform: translateZ(2px);
            transition: opacity 0.65s ease, border-color 0.5s ease, box-shadow 0.5s ease;
        }
        .everest-root.is-3d .floor-pad {
            opacity: 1;
        }
        /* Floor pad glows while the card above it is lifted */
        .everest-root.is-3d .kpi-slot:has(.kpi-card.is-elevated) .floor-pad {
            border-color: rgba(2, 132, 199, 0.65);
            box-shadow: 0 0 40px rgba(2, 132, 199, 0.35);
        }
        /* Monochrome Vertical Light Beam */
        .light-pillar {
            position: absolute;
            bottom: 12px;
            left: 14%;
            right: 14%;
            height: 28px;
            background: linear-gradient(to top, rgba(15, 23, 42, 0.2), rgba(148, 163, 184, 0.08) 70%, transparent);
            opacity: 0;
            pointer-events: none;
            transform-origin: bottom center;
            transform: translateZ(2px) rotateX(calc(var(--tilt-x) * -1));
            transition: opacity 0.65s ease;
        }
        .everest-root.is-3d .light-pillar {
            opacity: 1;
        }
        /* Monochrome Frosted Light Liquid-Glass Card Container */
        .holo-card {
            position: relative;
            flex: 1;
            border-radius: 18px;
            padding: 18px;
            background: linear-gradient(150deg, rgba(255, 255, 255, 0.92), rgba(248, 250, 252, 0.96));
            border: 1px solid var(--border-specular);
            box-shadow: 0 10px 26px -8px rgba(15, 23, 42, 0.09), inset 0 1px 0 rgba(255, 255, 255, 1);
            transform-origin: bottom center;
            transform-style: preserve-3d;
            overflow: visible;
            cursor: pointer;
            transition:
                transform 0.95s cubic-bezier(0.16, 1, 0.3, 1),
                box-shadow 0.55s ease,
                border-color 0.45s ease,
                background 0.45s ease;
        }
        .holo-card:hover {
            border-color: rgba(15, 23, 42, 0.28);
        }
        /* Upright billboard state for the top 4 KPI cards */
        .everest-root.is-3d .kpi-card {
            transform: translateZ(24px) rotateX(calc(var(--tilt-x) * -1));
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.96), rgba(241, 245, 249, 0.98));
            border-color: var(--border-silver);
            box-shadow:
                0 26px 46px -12px rgba(15, 23, 42, 0.22),
                0 0 28px rgba(255, 255, 255, 0.85),
                inset 0 1px 0 rgba(255, 255, 255, 1),
                inset 0 -8px 18px -6px rgba(15, 23, 42, 0.06);
        }
        .everest-root.is-3d .kpi-card:hover:not(.is-elevated) {
            transform: translateZ(38px) rotateX(calc(var(--tilt-x) * -1)) scale(1.03);
            border-color: #0f172a;
            box-shadow:
                0 34px 56px -12px rgba(15, 23, 42, 0.28),
                0 0 36px rgba(255, 255, 255, 0.95);
        }
        /* Click-to-Elevate for KPI cards: lifts along the Z axis (see --lift-kpi) */
        .everest-root.is-3d .kpi-card.is-elevated {
            transform: translateZ(var(--lift-kpi)) rotateX(calc(var(--tilt-x) * -1)) scale(1.08);
            border-color: #0f172a;
            background: linear-gradient(160deg, #ffffff, #f8fafc);
            box-shadow:
                0 60px 90px -14px rgba(15, 23, 42, 0.38),
                0 0 56px rgba(255, 255, 255, 1),
                inset 0 0 22px rgba(255, 255, 255, 0.9);
            z-index: 120;
        }
        /* =====================================================================
           7. BOTTOM ROW: LOW-PROFILE TILTED CONSOLE PANELS (.lower-slot)
           ===================================================================== */
        .lower-grid {
            display: grid;
            grid-template-columns: 1.55fr 1fr;
            gap: 22px;
            flex: 1;
            transform-style: preserve-3d;
            overflow: visible;
            position: relative;
            z-index: 25;
        }
        .lower-slot {
            position: relative;
            transform-style: preserve-3d;
            overflow: visible;
            display: flex;
            flex-direction: column;
        }
        .console-base-mount {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
            transform-origin: bottom center;
            transform-style: preserve-3d;
            overflow: visible;
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .everest-root.is-3d .console-base-mount {
            transform: translateZ(4px) rotateX(-1deg);
        }
        /* Monochrome Luminous Hinge Strip along bottom edge */
        .hinge-glow-bar {
            position: absolute;
            bottom: 0;
            left: 5%;
            right: 5%;
            height: 5px;
            border-radius: 999px;
            background: linear-gradient(90deg, transparent, #64748b, #0f172a, #64748b, transparent);
            box-shadow: 0 0 14px rgba(15, 23, 42, 0.25);
            opacity: 0;
            pointer-events: none;
            transform: translateZ(2px);
            transition: opacity 0.65s ease;
            z-index: 5;
        }
        .everest-root.is-3d .hinge-glow-bar {
            opacity: 1;
        }
        .console-strut-left,
        .console-strut-right {
            position: absolute;
            bottom: 4px;
            top: 24px;
            width: 3px;
            border-radius: 999px;
            background: linear-gradient(to top, rgba(15, 23, 42, 0.35), rgba(100, 116, 139, 0.14));
            opacity: 0;
            pointer-events: none;
            transform: translateZ(2px);
            transition: opacity 0.65s ease;
        }
        .console-strut-left { left: 10px; }
        .console-strut-right { right: 10px; }
        .everest-root.is-3d .console-strut-left,
        .everest-root.is-3d .console-strut-right {
            opacity: 1;
        }
        /* Console card tilted back slightly in 3D Mode */
        .everest-root.is-3d .console-card {
            transform: rotateX(-5deg);
            background: linear-gradient(165deg, rgba(255, 255, 255, 0.95), rgba(241, 245, 249, 0.98));
            border-color: rgba(15, 23, 42, 0.24);
            box-shadow:
                0 24px 44px -12px rgba(15, 23, 42, 0.18),
                0 0 26px rgba(255, 255, 255, 0.8),
                inset 0 1px 0 rgba(255, 255, 255, 1);
        }
        .everest-root.is-3d .console-card:hover:not(.is-data-floating) {
            transform: translateZ(10px) rotateX(-5deg) scale(1.015);
            border-color: #0f172a;
            box-shadow:
                0 30px 52px -12px rgba(15, 23, 42, 0.24),
                0 0 34px rgba(255, 255, 255, 0.95);
        }
        /* =====================================================================
           7B. CONSOLE DATA-ONLY FLOATING PROJECTION
           ===================================================================== */
        .everest-root.is-3d .console-card.is-data-floating {
            transform: rotateX(-5deg);
            border-color: rgba(15, 23, 42, 0.45);
            background: linear-gradient(165deg, rgba(255, 255, 255, 0.96), rgba(241, 245, 249, 0.98));
            box-shadow:
                0 26px 48px -10px rgba(15, 23, 42, 0.22),
                0 0 34px rgba(255, 255, 255, 0.9),
                inset 0 0 22px rgba(15, 23, 42, 0.04);
            z-index: 110;
        }
        /* Monochrome Hologram Emitter Grid */
        .holo-emitter-grid {
            position: absolute;
            left: 16px;
            right: 16px;
            bottom: 14px;
            top: 58px;
            border-radius: 14px;
            pointer-events: none;
            opacity: 0;
            transform: translateZ(2px);
            background:
                radial-gradient(ellipse at center, rgba(15, 23, 42, 0.08), rgba(100, 116, 139, 0.04) 58%, transparent 82%),
                linear-gradient(to right, rgba(15, 23, 42, 0.1) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(15, 23, 42, 0.1) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
            border: 1px dashed rgba(15, 23, 42, 0.32);
            box-shadow: inset 0 0 20px rgba(15, 23, 42, 0.06);
            transition: opacity 0.55s ease;
        }
        .everest-root.is-3d .console-card.is-data-floating .holo-emitter-grid {
            opacity: 1;
        }
        /* Monochrome Charcoal Pop-Out Badge */
        .elevate-badge {
            position: absolute;
            top: -11px;
            right: 14px;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 9.5px;
            font-weight: 800;
            letter-spacing: 0.08em;
            color: #ffffff;
            background: linear-gradient(90deg, #0f172a, #334155);
            border: 1px solid #0f172a;
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.28);
            opacity: 0;
            transform: translateY(4px) scale(0.9);
            transition: opacity 0.28s ease, transform 0.28s ease;
            pointer-events: none;
        }
        .everest-root.is-3d .holo-card.is-elevated .elevate-badge,
        .everest-root.is-3d .console-card.is-data-floating .elevate-badge {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        /* =====================================================================
           8. KPI CARD INTERNALS (MONOCHROME CHROME + VIBRANT COLORFUL DATA)
           ===================================================================== */
        .kpi-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .kpi-label {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #475569;
        }
        .kpi-icon-box {
            width: 31px;
            height: 31px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.05);
            color: #1e293b;
            border: 1px solid rgba(15, 23, 42, 0.12);
        }
        .kpi-main {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
        }
        .kpi-value {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        /* High-Contrast Vibrant Data Gradients on Light Glass */
        .data-val-cyan {
            background: linear-gradient(135deg, #0369a1, #0284c7 60%, #0ea5e9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .data-val-emerald {
            background: linear-gradient(135deg, #047857, #059669 60%, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .data-val-violet {
            background: linear-gradient(135deg, #6d28d9, #7c3aed 60%, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .data-val-amber {
            background: linear-gradient(135deg, #b45309, #d97706 60%, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .kpi-trend {
            display: inline-flex;
            align-items: center;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 999px;
            background: rgba(16, 185, 129, 0.14);
            color: #047857;
            border: 1px solid rgba(5, 150, 105, 0.3);
        }
        .kpi-trend.trend-violet {
            background: rgba(139, 92, 246, 0.14);
            color: #6d28d9;
            border-color: rgba(124, 58, 237, 0.3);
        }
        .kpi-trend.trend-amber {
            background: rgba(245, 158, 11, 0.16);
            color: #b45309;
            border-color: rgba(217, 119, 6, 0.32);
        }
        .kpi-sparkbars {
            margin-top: 12px;
            height: 22px;
            display: flex;
            align-items: flex-end;
            gap: 5px;
        }
        .spark-bar {
            flex: 1;
            border-radius: 4px 4px 0 0;
            background: rgba(2, 132, 199, 0.28);
        }
        .spark-bar.highlight {
            background: linear-gradient(to top, #0284c7, #38bdf8);
            box-shadow: 0 2px 8px rgba(2, 132, 199, 0.35);
        }
        .kpi-progress-wrap {
            margin-top: 12px;
        }
        .kpi-progress-meta {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }
        .kpi-progress-track {
            width: 100%;
            height: 6px;
            border-radius: 999px;
            background: #e2e8f0;
            overflow: hidden;
        }
        .kpi-progress-fill {
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #059669, #10b981);
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
        }
        .kpi-sub-row {
            margin-top: 12px;
            padding-top: 9px;
            border-top: 1px solid rgba(15, 23, 42, 0.08);
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-secondary);
        }
        .latency-bars {
            margin-top: 14px;
            display: flex;
            gap: 6px;
        }
        .latency-slot {
            flex: 1;
            height: 6px;
            border-radius: 999px;
            background: #e2e8f0;
            overflow: hidden;
        }
        .latency-seg {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 999px;
            background: #f59e0b;
            transform-origin: left center;
        }
        /* =====================================================================
           9. REAL-TIME TELEMETRY & NODE STATUS INTERNALS
           ===================================================================== */
        .panel-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }
        .panel-title {
            font-size: 14.5px;
            font-weight: 800;
            color: #0f172a;
        }
        .panel-subtitle {
            font-size: 11.5px;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        .panel-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        /* Monochrome Timeframe Buttons */
        .timeframe-group {
            display: inline-flex;
            padding: 3px;
            border-radius: 9px;
            background: #f1f5f9;
            border: 1px solid rgba(15, 23, 42, 0.14);
        }
        .tf-btn {
            padding: 4px 10px;
            border-radius: 7px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tf-btn:hover {
            color: #0f172a;
        }
        .tf-btn.active {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.25);
        }
        .chart-legend {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 11px;
            color: #334155;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        /* Vibrant Data Peak Pill */
        .peak-pill {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 800;
            padding: 3px 10px;
            border-radius: 999px;
            background: rgba(2, 132, 199, 0.12);
            color: #0369a1;
            border: 1px solid rgba(2, 132, 199, 0.34);
        }
        /* Telemetry Floating Data Stage */
        .telemetry-data-stage {
            position: relative;
            padding: 12px 14px 10px;
            border-radius: 14px;
            background: rgba(248, 250, 252, 0.85);
            border: 1px solid rgba(15, 23, 42, 0.1);
            transform-origin: bottom center;
            transform-style: preserve-3d;
            z-index: 15;
            transition:
                transform 0.95s cubic-bezier(0.16, 1, 0.3, 1),
                background 0.45s ease,
                border-color 0.45s ease,
                box-shadow 0.5s ease;
        }
        .telemetry-stage-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 8px;
        }
        .everest-root.is-3d .console-card.is-data-floating .telemetry-data-stage {
            transform: translateZ(var(--lift-data)) rotateX(calc(var(--tilt-x) * -0.9));
            background: linear-gradient(155deg, rgba(255, 255, 255, 0.98), rgba(241, 245, 249, 0.99));
            border-color: rgba(15, 23, 42, 0.38);
            box-shadow:
                0 44px 70px -10px rgba(15, 23, 42, 0.3),
                0 0 30px rgba(255, 255, 255, 0.95),
                inset 0 1px 0 rgba(255, 255, 255, 1);
        }
        .svg-chart-container {
            width: 100%;
            height: 154px;
            position: relative;
        }
        .chart-xaxis {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(15, 23, 42, 0.08);
            font-size: 11px;
            color: var(--text-muted);
        }
        /* Monochrome Ping Node Button */
        .ping-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 11px;
            border-radius: 8px;
            border: 1px solid rgba(15, 23, 42, 0.22);
            background: #ffffff;
            color: #0f172a;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.06);
            transition: all 0.2s ease;
        }
        .ping-btn:hover {
            background: #0f172a;
            border-color: #0f172a;
            color: #ffffff;
            box-shadow: 0 6px 14px rgba(15, 23, 42, 0.2);
        }
        .server-list {
            display: flex;
            flex-direction: column;
            gap: 9px;
            margin-top: 6px;
            transform-style: preserve-3d;
            overflow: visible;
            position: relative;
            z-index: 15;
        }
        /* Monochrome Server Row Containers */
        .server-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 9px 11px;
            border-radius: 12px;
            background: rgba(248, 250, 252, 0.9);
            border: 1px solid rgba(15, 23, 42, 0.09);
            transform-origin: bottom center;
            transform-style: preserve-3d;
            transition:
                transform 0.95s cubic-bezier(0.16, 1, 0.3, 1),
                border-color 0.35s ease,
                background 0.35s ease,
                box-shadow 0.45s ease;
        }
        .server-row:hover {
            border-color: rgba(15, 23, 42, 0.24);
            background: #ffffff;
        }
        /* Detached floating holographic data plates in 3D Mode */
        .everest-root.is-3d .console-card.is-data-floating .server-list {
            gap: 12px;
        }
        .everest-root.is-3d .console-card.is-data-floating .server-row {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.98), rgba(241, 245, 249, 0.99));
            border-color: rgba(15, 23, 42, 0.36);
            box-shadow:
                0 32px 50px -8px rgba(15, 23, 42, 0.26),
                0 0 22px rgba(255, 255, 255, 0.95),
                inset 0 1px 0 rgba(255, 255, 255, 1);
        }
        .everest-root.is-3d .console-card.is-data-floating .server-row[data-node="0"] {
            transform: translateZ(calc(var(--lift-node) - var(--lift-node-step) * 0)) rotateX(calc(var(--tilt-x) * -0.9));
        }
        .everest-root.is-3d .console-card.is-data-floating .server-row[data-node="1"] {
            transform: translateZ(calc(var(--lift-node) - var(--lift-node-step) * 1)) rotateX(calc(var(--tilt-x) * -0.9));
        }
        .everest-root.is-3d .console-card.is-data-floating .server-row[data-node="2"] {
            transform: translateZ(calc(var(--lift-node) - var(--lift-node-step) * 2)) rotateX(calc(var(--tilt-x) * -0.9));
        }
        .everest-root.is-3d .console-card.is-data-floating .server-row[data-node="3"] {
            transform: translateZ(calc(var(--lift-node) - var(--lift-node-step) * 3)) rotateX(calc(var(--tilt-x) * -0.9));
        }
        .everest-root.is-3d .console-card.is-data-floating .server-row:hover {
            border-color: #0f172a;
            box-shadow:
                0 38px 58px -8px rgba(15, 23, 42, 0.32),
                0 0 30px rgba(255, 255, 255, 1);
        }
        .server-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }
        /* Monochrome Node Hardware Icons */
        .server-icon {
            width: 30px;
            height: 30px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            background: rgba(15, 23, 42, 0.05);
            color: #1e293b;
            border: 1px solid rgba(15, 23, 42, 0.12);
        }
        .server-details {
            flex: 1;
            min-width: 0;
        }
        .server-name-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            margin-bottom: 4px;
        }
        .server-name {
            font-size: 12px;
            font-weight: 700;
            color: #0f172a;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;

        /* Vibrant Data CPU & Latency Colors */
        .cpu-label {
            font-family: var(--font-mono);
            font-size: 10.5px;
            font-weight: 700;
            color: #059669;
        }
        .cpu-label.cpu-warn {
            color: #d97706;
        }
        .cpu-bar-track {
            width: 100%;
            height: 4px;
            border-radius: 999px;
            background: #e2e8f0;
            overflow: hidden;
        }
        .cpu-bar-fill {
            height: 100%;
            border-radius: 999px;
            background: linear-gradient(90deg, #059669, #0284c7);
            transition: width 0.5s ease, background 0.4s ease;
        }
        .cpu-bar-fill.cpu-warn {

        .server-metrics {

        /* =====================================================================
           10. MINIMALIST MONOCHROME FLOATING 3D CLOSE HUD
           ===================================================================== */
        .spatial-hud {
            position: fixed;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%) translateY(90px);
            z-index: 200;
            display: flex;

            transform: translateX(-50%) translateY(0);
            opacity: 1;
            pointer-events: auto;
        }
        .hud-btn-exit {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            border-radius: 999px;
            border: 1px solid #0f172a;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: #ffffff;
            font-size: 12.5px;
            font-weight: 700;
            letter-spacing: 0.02em;
            cursor: pointer;
            box-shadow:
                0 16px 32px -8px rgba(15, 23, 42, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
            transition: transform 0.2s ease, background 0.25s ease, box-shadow 0.25s ease, color 0.2s ease;
        }
        .hud-btn-exit:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #ffffff, #f1f5f9);
            border-color: #0f172a;
            color: #0f172a;
            box-shadow:
                0 20px 38px -8px rgba(15, 23, 42, 0.28);
        }
        .hud-btn-exit:active {
            transform: scale(0.97);
        }
        /* =====================================================================
           10B. TOUCH / PRESS ANIMATIONS (3D MODE)
           ===================================================================== */
        .holo-card {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        /* Ripple that spreads from the exact touch point */
        .holo-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: inherit;
            pointer-events: none;
            opacity: 0;
            background: radial-gradient(circle at var(--rx, 50%) var(--ry, 50%), rgba(2, 132, 199, 0.3), rgba(2, 132, 199, 0.1) 30%, transparent 60%);
            transform: translateZ(1px);
        }
        .everest-root.is-3d .holo-card[data-touch]::before {
            animation: touchRipple 0.7s ease-out;
        }
        @keyframes touchRipple {
            0%   { opacity: 1; clip-path: circle(0% at var(--rx, 50%) var(--ry, 50%)); }
            100% { opacity: 0; clip-path: circle(150% at var(--rx, 50%) var(--ry, 50%)); }
        }
        /* Pressed-in state while finger / mouse is held down */
        .everest-root.is-3d .kpi-card[data-pressed]:not(.is-elevated) {
            transform: translateZ(10px) rotateX(calc(var(--tilt-x) * -1)) scale(0.965);
            transition-duration: 0.14s;
            border-color: #0f172a;
            box-shadow:
                0 10px 20px -8px rgba(15, 23, 42, 0.32),
                inset 0 0 18px rgba(15, 23, 42, 0.06);
        }
        .everest-root.is-3d .kpi-card.is-elevated[data-pressed] {
            transform: translateZ(calc(var(--lift-kpi) - 22px)) rotateX(calc(var(--tilt-x) * -1)) scale(1.03);
            transition-duration: 0.14s;
        }
        .everest-root.is-3d .console-card[data-pressed]:not(.is-data-floating) {
            transform: translateZ(-2px) rotateX(-5deg) scale(0.985);
            transition-duration: 0.14s;
            border-color: #0f172a;
        }
        .everest-root.is-3d .console-card.is-data-floating[data-pressed] {
            transform: rotateX(-5deg) scale(0.99);
            transition-duration: 0.14s;
        }
        /* Spring (overshoot + settle) when a KPI card lifts */
        .everest-root.is-3d .kpi-card.is-elevated {
            animation: kpiLiftSpring 0.8s linear;
        }
        @keyframes kpiLiftSpring {
            0%   { transform: translateZ(24px) rotateX(calc(var(--tilt-x) * -1)) scale(0.97); animation-timing-function: cubic-bezier(0.2, 0.9, 0.3, 1); }
            45%  { transform: translateZ(calc(var(--lift-kpi) + 26px)) rotateX(calc(var(--tilt-x) * -1)) scale(1.13); animation-timing-function: ease-in-out; }
            72%  { transform: translateZ(calc(var(--lift-kpi) - 8px)) rotateX(calc(var(--tilt-x) * -1)) scale(1.06); animation-timing-function: ease-out; }
            100% { transform: translateZ(var(--lift-kpi)) rotateX(calc(var(--tilt-x) * -1)) scale(1.08); }
        }
        /* Spring for the floating telemetry plate */
        .everest-root.is-3d .console-card.is-data-floating .telemetry-data-stage {
            animation: dataStageSpring 0.9s linear;
        }
        @keyframes dataStageSpring {
            0%   { transform: translateZ(0) rotateX(0deg); animation-timing-function: cubic-bezier(0.2, 0.9, 0.3, 1); }
            50%  { transform: translateZ(calc(var(--lift-data) + 22px)) rotateX(calc(var(--tilt-x) * -0.9)); animation-timing-function: ease-in-out; }
            76%  { transform: translateZ(calc(var(--lift-data) - 6px)) rotateX(calc(var(--tilt-x) * -0.9)); animation-timing-function: ease-out; }
            100% { transform: translateZ(var(--lift-data)) rotateX(calc(var(--tilt-x) * -0.9)); }
        }
        /* Node rows pop up one after another */
        .server-row[data-node="0"] { --row-index: 0; }
        .server-row[data-node="1"] { --row-index: 1; }
        .server-row[data-node="2"] { --row-index: 2; }
        .server-row[data-node="3"] { --row-index: 3; }
        .everest-root.is-3d .console-card.is-data-floating .server-row {
            animation: rowSpring 0.9s linear;
            animation-fill-mode: backwards;
            animation-delay: calc(var(--row-index, 0) * 70ms);
        }
        @keyframes rowSpring {
            0%   { transform: translateZ(0) rotateX(0deg); animation-timing-function: cubic-bezier(0.2, 0.9, 0.3, 1); }
            52%  { transform: translateZ(calc(var(--lift-node) - var(--lift-node-step) * var(--row-index, 0) + 24px)) rotateX(calc(var(--tilt-x) * -0.9)); animation-timing-function: ease-in-out; }
            76%  { transform: translateZ(calc(var(--lift-node) - var(--lift-node-step) * var(--row-index, 0) - 6px)) rotateX(calc(var(--tilt-x) * -0.9)); animation-timing-function: ease-out; }
            100% { transform: translateZ(calc(var(--lift-node) - var(--lift-node-step) * var(--row-index, 0))) rotateX(calc(var(--tilt-x) * -0.9)); }
        }
        /* Shockwave ring on the floor pad + glow for console panels */
        .floor-pad::after {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: inherit;
            border: 2px solid rgba(2, 132, 199, 0.7);
            opacity: 0;
            pointer-events: none;
        }
        .everest-root.is-3d .kpi-slot:has(.kpi-card.is-elevated) .floor-pad::after,
        .everest-root.is-3d .lower-slot:has(.console-card.is-data-floating) .floor-pad::after {
            animation: padShockwave 0.9s ease-out;
        }
        @keyframes padShockwave {
            0%   { opacity: 0.85; transform: scale(1); }
            100% { opacity: 0; transform: scale(1.22); }
        }
        .everest-root.is-3d .lower-slot:has(.console-card.is-data-floating) .floor-pad {
            border-color: rgba(2, 132, 199, 0.65);
            box-shadow: 0 0 40px rgba(2, 132, 199, 0.35);
        }
        /* Badge pops with a little overshoot */
        .elevate-badge {
            transition: opacity 0.28s ease, transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);

        @media (prefers-reduced-motion: reduce) {
            .everest-root.is-3d .holo-card[data-touch]::before,
            .everest-root.is-3d .kpi-card.is-elevated,
            .everest-root.is-3d .console-card.is-data-floating .telemetry-data-stage,
            .everest-root.is-3d .console-card.is-data-floating .server-row,
            .everest-root.is-3d .floor-pad::after {
                animation: none !important;
            }
        }
        /* =====================================================================
           10C. DATA ENTRANCE ANIMATIONS (bars, chart, counters)
           ===================================================================== */
        .kpi-value {
            font-variant-numeric: tabular-nums;
        }
        /* Revenue: bars grow upward, left to right */
        .spark-bar {
            height: var(--h, 100%);
            transform-origin: bottom center;
            animation: barGrow var(--motion-duration-bar) var(--motion-ease-grow) backwards;
            animation-delay: calc(var(--i, 0) * var(--motion-stagger));
        }
        @keyframes barGrow {
            from { height: 0; }
        }
        /* Telemetry: the curve rises from the chart floor to its peak; dots ride the curve */
        .chart-rise {
            transform-origin: 0 168px;
            animation: chartRise var(--motion-duration-draw) var(--motion-ease-grow) backwards;
        }
        @keyframes chartRise {
            from { transform: scaleY(0); }
        }
        .chart-point {
            animation: pointRise var(--motion-duration-draw) var(--motion-ease-grow) backwards;
        }
        @keyframes pointRise {
            from { transform: translateY(var(--dy, 0px)); }
        }
        /* Node Status: CPU bars fill from empty, row by row */
        .cpu-bar-fill {
            animation: barFill var(--motion-duration-bar) var(--motion-ease-grow) backwards;
            animation-delay: calc(var(--row-index, 0) * var(--motion-stagger));
        }
        @keyframes barFill {
            from { width: 0; }
        }
        @media (prefers-reduced-motion: reduce) {
            .spark-bar,
            .chart-rise,
            .chart-point,
            .cpu-bar-fill {
                animation: none !important;
            }
        }
        /* =====================================================================
           10D. SECTION PAGES (Analytics / Infrastructure / Security)
           ===================================================================== */
        .kpi-progress-fill.fill-cyan {
            background: linear-gradient(90deg, #0284c7, #38bdf8);
            box-shadow: 0 0 8px rgba(2, 132, 199, 0.4);

            box-shadow: 0 0 8px rgba(245, 158, 11, 0.4);

        /* =====================================================================
           10E. 3D NAVIGATION MENU + SETTINGS CONTROLS
           ===================================================================== */
        .nav-item:focus-visible,
        .setting-switch:focus-visible {
            outline: 2px solid #0284c7;
            outline-offset: 2px;
        }
        /* Keep the 3D chain unbroken through the sidebar */
        .sidebar > div,

            padding-top: 18px;
        }
        .everest-root.is-3d .brand-wrap {
            transform: translateZ(26px) rotateX(calc(var(--tilt-x) * -0.3));
            transform-origin: 50% 100%;
        }

            transform: translateZ(8px);
        }
        .everest-root.is-3d .sidebar-promo {
            transform: translateZ(20px) rotateX(calc(var(--tilt-x) * -0.3));
            transform-origin: 50% 100%;
            box-shadow: 0 4px 0 #cbd5e1, 0 16px 24px -10px rgba(15, 23, 42, 0.3);
        }
        /* Each menu item becomes a raised slab (key-cap) standing on the floor */
        .everest-root.is-3d .nav-item {
            --nav-x: 0px;
            --nav-z: 8px;
            position: relative;
            transform-style: preserve-3d;
            transform-origin: 50% 100%;
            transform: translate3d(var(--nav-x), 0, var(--nav-z)) rotateX(calc(var(--tilt-x) * -0.3));
            background: linear-gradient(180deg, #ffffff, #eef2f7);
            border: 1px solid rgba(15, 23, 42, 0.14);
            box-shadow:
                inset 0 1px 0 #ffffff,
                0 5px 0 #cbd5e1,
                0 16px 20px -10px rgba(15, 23, 42, 0.32);
            transition:
                transform 0.5s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.35s ease,
                background 0.35s ease,
                color 0.25s ease;
            animation: navRise 0.8s cubic-bezier(0.34, 1.4, 0.64, 1) backwards;
            animation-delay: calc(var(--nav-i, 0) * var(--motion-stagger));
        }
        .everest-root.is-3d .nav-item:hover {
            --nav-x: 7px;
            --nav-z: 14px;
            color: #0f172a;
            background: linear-gradient(180deg, #ffffff, #e8eef6);
            box-shadow:
                inset 0 1px 0 #ffffff,

                0 24px 28px -10px rgba(15, 23, 42, 0.38);

        .everest-root.is-3d .nav-item:active {
            --nav-x: 3px;
            --nav-z: 6px;
            transition-duration: 0.12s;
            box-shadow:
                inset 0 1px 0 #ffffff,
                0 2px 0 #cbd5e1,
                0 6px 10px -6px rgba(15, 23, 42, 0.3);
        }
        .everest-root.is-3d .nav-item.active {
            --nav-x: 11px;
            --nav-z: 16px;
            color: #ffffff;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-color: #0f172a;
            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.14),
                0 8px 0 #020617,
                -5px 0 16px -2px rgba(2, 132, 199, 0.55),
                0 28px 34px -10px rgba(15, 23, 42, 0.55);
            animation: navSelect 0.8s cubic-bezier(0.34, 1.4, 0.64, 1) backwards;
            animation-delay: calc(var(--nav-i, 0) * var(--motion-stagger));
        }
        .everest-root.is-3d .nav-item::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: 100%;
            height: 14px;
        }
        @keyframes navRise {
            from { transform: translate3d(0, 0, 0) rotateX(0deg); }
        }
        @keyframes navSelect {
            0%   { transform: translate3d(0, 0, 0) rotateX(0deg); }

            100% { transform: translate3d(var(--nav-x), 0, var(--nav-z)) rotateX(calc(var(--tilt-x) * -0.3)); }
        }
        /* Settings: switches and descriptions inside panel rows */

        /* =====================================================================
           10I. BLUE \u2192 GREEN GRADIENT BUTTONS (navigation + 3D buttons)
           ===================================================================== */
        .everest-root {
            --grad-blue-green: linear-gradient(135deg, #2563eb 0%, #0891b2 52%, #059669 100%);
            --grad-blue-green-bright: linear-gradient(135deg, #3b82f6 0%, #06b6d4 52%, #10b981 100%);
            --grad-blue-green-deep: linear-gradient(135deg, #1e40af 0%, #0e7490 52%, #047857 100%);
        }
        /* Navigation buttons \u2014 black at rest, blue \u2192 green gradient wipes in on touch / hover / press */
        .nav-item {
            background: var(--grad-blue-green) no-repeat left center / 0% 100%, #0b0b0d;
            border-color: rgba(255, 255, 255, 0.12);
            color: #cbd5e1;
            text-shadow: none;
            box-shadow: none;
            transition: background-size 0.35s ease, color 0.25s ease, box-shadow 0.3s ease, border-color 0.3s ease;

        .nav-item:hover,
        .nav-item:active {
            background: var(--grad-blue-green) no-repeat left center / 100% 100%, #0b0b0d;
            border-color: rgba(255, 255, 255, 0.3);
            color: #ffffff;
            text-shadow: 0 1px 1px rgba(0, 0, 0, 0.3);
            box-shadow: 0 6px 16px -6px rgba(6, 182, 212, 0.5);
        }
        .nav-item.active {
            background: var(--grad-blue-green-bright) no-repeat left center / 100% 100%, #0b0b0d;
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.55);
            text-shadow: 0 1px 1px rgba(0, 0, 0, 0.3);

            border-color: rgba(255, 255, 255, 0.35);

            color: #e2e8f0;
            background: var(--grad-blue-green) no-repeat left center / 0% 100%, linear-gradient(180deg, #1b1b1f, #09090b);

        /* =====================================================================
           10J. 2D FLOATING CARDS (cards pop out of the page and hover above it)
           Uses the individual translate property for the idle bob so it can
           combine with transform (entrance, hover lift, press).
           ===================================================================== */
        .kpi-grid > .kpi-slot:nth-child(1) { --float-i: 0; }
        .kpi-grid > .kpi-slot:nth-child(2) { --float-i: 1; }
        .kpi-grid > .kpi-slot:nth-child(3) { --float-i: 2; }
        .kpi-grid > .kpi-slot:nth-child(4) { --float-i: 3; }
        .lower-grid > .lower-slot:nth-child(1) { --float-i: 4; }
        .lower-grid > .lower-slot:nth-child(2) { --float-i: 5; }
        .lower-grid > .lower-slot:nth-child(3) { --float-i: 6; }
        .lower-grid > .lower-slot:nth-child(4) { --float-i: 7; }
        @keyframes cardPopOut {
            0%   { opacity: 0; transform: translateY(28px) scale(0.93); }
            60%  { opacity: 1; transform: translateY(-7px) scale(1.025); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes cardFloat {
            0%, 100% { translate: 0 0; }
            50%      { translate: 0 -5px; }
        }
        @keyframes cardFloatSoft {
            0%, 100% { translate: 0 0; }
            50%      { translate: 0 -3px; }
        }
